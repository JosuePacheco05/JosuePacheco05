<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="840" height="300" viewBox="0 0 840 300">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .t   { fill: #E6E9EF; font-size: 14px; }
    .dim { fill: #7F93AD; font-size: 13px; }
    .pr  { fill: #5FD3E6; font-size: 14px; font-weight: 700; }
    .am  { fill: #FFB000; font-size: 14px; }
    .lbl { fill: #7F93AD; font-size: 11px; }
    .trace { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 5s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 520; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; stroke-dashoffset: 0; } .cursor { animation: none; } }
  </style>

  <rect x="1" y="1" width="838" height="298" rx="12" fill="#0E1A2B" stroke="#24364F" stroke-width="2"/>
  <line x1="1" y1="40" x2="839" y2="40" stroke="#24364F" stroke-width="2"/>
  <circle cx="24" cy="21" r="6" fill="#FFB000"/>
  <circle cx="44" cy="21" r="6" fill="#5FD3E6"/>
  <circle cx="64" cy="21" r="6" fill="#3A4E6B"/>
  <text x="420" y="26" text-anchor="middle" class="mono dim">josue@upiih: ~/perfil</text>

  <!-- terminal -->
  <text x="28" y="78"  class="mono pr">$ whoami</text>
  <text x="28" y="104" class="mono t">Josué Pacheco · Ing. Mecatrónica (IPN UPIIH)</text>
  <text x="28" y="128" class="mono dim">enfoque   <tspan class="am">controls engineering, embebidos</tspan></text>
  <text x="28" y="150" class="mono dim">meta      <tspan class="am">automatización automotriz</tspan></text>
  <text x="28" y="186" class="mono pr">$ ls proyectos/</text>
  <text x="28" y="212" class="mono t">motor-dc/   minisumo-esp32/</text>
  <text x="28" y="234" class="mono t">riego-fpga/ banda-plc/</text>
  <text x="28" y="270" class="mono pr">$ <tspan class="cursor" fill="#FFB000">█</tspan></text>

  <!-- osciloscopio -->
  <rect x="520" y="60" width="296" height="214" rx="6" fill="#0A1422" stroke="#24364F"/>
  <g stroke="#1B2A40" stroke-width="1">
    <line x1="557" y1="72" x2="557" y2="246"/><line x1="594" y1="72" x2="594" y2="246"/>
    <line x1="631" y1="72" x2="631" y2="246"/><line x1="668" y1="72" x2="668" y2="246"/>
    <line x1="705" y1="72" x2="705" y2="246"/><line x1="742" y1="72" x2="742" y2="246"/>
    <line x1="779" y1="72" x2="779" y2="246"/>
    <line x1="532" y1="101" x2="804" y2="101"/><line x1="532" y1="130" x2="804" y2="130"/>
    <line x1="532" y1="159" x2="804" y2="159"/><line x1="532" y1="188" x2="804" y2="188"/>
    <line x1="532" y1="217" x2="804" y2="217"/>
  </g>
  <line x1="532" y1="112" x2="804" y2="112" stroke="#5FD3E6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path class="trace" d="M532 232 L560 232 C574 232 584 96 602 92 C620 88 628 126 646 120 C664 114 672 108 690 112 C706 115 714 112 730 112 L804 112"
        fill="none" stroke="#FFB000" stroke-width="2.5" stroke-linecap="round"/>
  <text x="532" y="264" class="mono lbl">CH1 velocidad</text>
  <text x="804" y="264" text-anchor="end" class="mono lbl" fill="#5FD3E6">- - - setpoint</text>
</svg>
